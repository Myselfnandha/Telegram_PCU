services:
  tg-power-suite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-power-suite
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/sessions:/app/backend/sessions
      - ./backend/downloads:/app/backend/downloads
      - ./backend/.env:/app/backend/.env
    environment:
      - TG_HOST=0.0.0.0
      - TG_PORT=8088
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/system/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
