[pytest]
asyncio_mode = strict
pythonpath = backend
testpaths = backend/tests
addopts = --import-mode=importlib -m "not playwright"
markers =
    playwright: Playwright end-to-end browser tests requiring live frontend on port 8088
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient`.*:UserWarning
    ignore:.*StarletteDeprecationWarning.*
